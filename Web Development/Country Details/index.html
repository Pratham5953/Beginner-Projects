<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Information of Countries</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div id="nav">
            <div id="in_nav">
                <h2 id="heading">Information of Contries</h2>
                <h2 id="country">Country : Not Entered</h2>
            </div>
        </div>

    </header>
    <div id="box0">
        <div id="box1">
            <img src="img.png" alt="Flag", id="flag">
            <div><label for="name">Enter country name: </label><input type="text", placeholder="Enter country name", id="cname"><button id="submit">Submit</button></div>
            <p id="error"></p>
            <p id="load">loading......</p>
        </div>
        <div id="info">
            <div class="intxt">
                <h2 class="inst">Country : </h2>
                <h2 class="ans", id="name"></h2>
            </div>
            <div class="intxt">
                <h2 class="inst">Capital City :</h2>
                <h2 class="ans", id="cc"></h2>
            </div>
            <div class="intxt">
                <h2 class="inst">Continent:</h2>
                <h2 class="ans", id="cont"></h2>
            </div>
            <div class="intxt">
                <h2 class="inst">Sub-Region:</h2>
                <h2 class="ans", id="sr"></h2>
            </div>
            <div class="intxt">
                <h2 class="inst">Government Type:</h2>
                <h2 class="ans", id="gov"></h2>
            </div>
            <div class="intxt">
                <h2 class="inst">Currency :</h2>
                <h2 class="ans", id="cur"></h2>
            </div>
            <div class="intxt">
                <h2 class="inst">Area :</h2>
                <h2 class="ans", id="ar"></h2>
            </div>
            <div class="intxt">
                <h2 class="inst">Population :</h2>
                <h2 class="ans", id="pop"></h2>
            </div>
            <div class="intxt">
                <h2 class="inst">Bordering Countries :</h2>
                <h2 class="ans", id="border"></h2>
            </div>
            <div class="intxt">
                <h2 class="inst", id="tzl">Timezones :</h2>
                <h2 class="ans", id="tz"></h2>
            </div>
            
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
